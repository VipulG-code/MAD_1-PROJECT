{% extends 'base.html' %}
{% block title %}Create Placement Drive{% endblock %}
{% block page_title %}Create New Drive{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('company_dashboard') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><i class="bi bi-briefcase-fill me-2"></i>New Placement Drive</div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Job Title <span class="text-danger">*</span></label>
              <input type="text" name="job_title" class="form-control" required placeholder="e.g. Software Engineer, Data Analyst">
            </div>
            <div class="col-md-6">
              <label class="form-label">Package / CTC</label>
              <input type="text" name="package" class="form-control" placeholder="e.g. 12 LPA, 8-10 LPA">
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" name="location" class="form-control" placeholder="e.g. Bengaluru, Remote">
            </div>
            <div class="col-12">
              <label class="form-label">Job Description</label>
              <textarea name="job_description" class="form-control" rows="4" placeholder="Describe the role, responsibilities..."></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Eligibility Criteria</label>
              <textarea name="eligibility_criteria" class="form-control" rows="3" placeholder="e.g. CGPA >= 7.0, B.Tech CS/IT, No active backlogs..."></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
              <input type="date" name="application_deadline" class="form-control" required>
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-send me-2"></i>Submit for Approval
              </button>
              <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="alert alert-info mt-3">
      <i class="bi bi-info-circle me-2"></i>
      Your drive will be reviewed by the admin before students can apply.
    </div>
  </div>
</div>
{% endblock %}
