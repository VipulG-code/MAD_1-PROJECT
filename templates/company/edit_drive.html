{% extends 'base.html' %}
{% block title %}Edit Drive{% endblock %}
{% block page_title %}Edit Drive{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('company_dashboard') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><i class="bi bi-pencil me-2"></i>Edit: {{ drive.job_title }}</div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Job Title <span class="text-danger">*</span></label>
              <input type="text" name="job_title" class="form-control" required value="{{ drive.job_title }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Package / CTC</label>
              <input type="text" name="package" class="form-control" value="{{ drive.package or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" name="location" class="form-control" value="{{ drive.location or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Job Description</label>
              <textarea name="job_description" class="form-control" rows="4">{{ drive.job_description or '' }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Eligibility Criteria</label>
              <textarea name="eligibility_criteria" class="form-control" rows="3">{{ drive.eligibility_criteria or '' }}</textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
              <input type="date" name="application_deadline" class="form-control" required
                     value="{{ drive.application_deadline.strftime('%Y-%m-%d') }}">
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-2"></i>Save Changes
              </button>
              <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="alert alert-warning mt-3">
      <i class="bi bi-exclamation-triangle me-2"></i>
      Editing will re-submit the drive for admin approval.
    </div>
  </div>
</div>
{% endblock %}
